[package]
name = "ecliptishock-core"
version = "0.1.0"
edition = "2021"
description = "Ecliptica (VRChat) log events -> OpenShock commands: parser, damage mapper, dispatcher and live engine"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
anyhow = "1"
